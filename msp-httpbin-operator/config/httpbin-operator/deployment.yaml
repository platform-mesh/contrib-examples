# httpbin-operator deployment — owner: httpbin-expert
# Deploys the httpbin-operator controller-manager into the kind cluster.
#
# The IMAGE_PLACEHOLDER is replaced by hack/httpbin-operator-install.sh with the actual image
# from the $HTTPBIN_OPERATOR_IMAGE env var.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin-operator-controller-manager
  namespace: httpbin-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: httpbin-operator-manager-role
rules:
- apiGroups: ["orchestrate.platform-mesh.io"]
  resources: ["httpbins"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["orchestrate.platform-mesh.io"]
  resources: ["httpbins/finalizers"]
  verbs: ["update"]
- apiGroups: ["orchestrate.platform-mesh.io"]
  resources: ["httpbins/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["orchestrate.platform-mesh.io"]
  resources: ["httpbindeployments"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["orchestrate.platform-mesh.io"]
  resources: ["httpbindeployments/finalizers"]
  verbs: ["update"]
- apiGroups: ["orchestrate.platform-mesh.io"]
  resources: ["httpbindeployments/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: httpbin-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: httpbin-operator-manager-role
subjects:
- kind: ServiceAccount
  name: httpbin-operator-controller-manager
  namespace: httpbin-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-operator-controller-manager
  namespace: httpbin-system
  labels:
    app.kubernetes.io/name: httpbin-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: httpbin-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: httpbin-operator
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: httpbin-operator-controller-manager
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=false
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
