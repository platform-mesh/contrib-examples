# config/provider/providermetadata.yaml — owner: portal-expert
#
# ProviderMetadata applied into :root:providers:postgres-provider on cluster A. Surfaces this
# provider in the default Platform Mesh portal's provider listing (icon, description, contacts,
# support channels). `metadata.name` MUST equal the APIExport name `postgresql.cnpg.io` — the
# portal joins ProviderMetadata <-> APIExport on that name.
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ProviderMetadata
metadata:
  name: postgresql.cnpg.io
spec:
  displayName: CloudNativePG (example)
  description: |
    Self-service PostgreSQL via CloudNativePG, exposed through Platform Mesh as the
    `clusters.postgresql.cnpg.io` API. Order a Cluster in your account workspace and
    the connection Secret is synced back to you.
  contacts:
    - displayName: Platform Mesh Contrib Examples
      email: noreply@platform-mesh.io
      role: ["Maintainer"]
  preferredSupportChannels:
    - displayName: contrib-examples (GitHub)
      url: https://github.com/platform-mesh/contrib-examples
  icon:
    # Simple "PG" badge on PostgreSQL-blue (#336791). Inline SVG -> base64.
    light:
      data: "data:image/svg+xml;base64,"
    dark:
      data: "data:image/svg+xml;base64,"
